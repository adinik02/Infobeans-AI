                - heading "Reduzierung der HR-Betriebskosten um 20 % und schnellere Fallbearbeitung für mehr als 50.000 Mitarbeitende" [level=3] [ref=f18e96]
                - generic [ref=f18e97]:
                  - generic [ref=f18e98]: ServiceNow HRSD
                  - generic [ref=f18e99]: KI-gestützte Suche
                  - generic [ref=f18e100]: BFSI
              - generic [ref=f18e101]:
                - generic [ref=f18e102]:
                  - generic [ref=f18e103]:
                    - heading "Was" [level=4] [ref=f18e104]
                    - paragraph [ref=f18e105]: Ersetzung einer fragmentierten HR-Landschaft aus mehreren Systemen durch ein einziges Employee Center — zur Zusammenführung von Fallmanagement, Wissenssuche und Profilaktualisierungen über ServiceNow und Oracle HR hinweg.
                    - paragraph [ref=f18e106]: "Das Ergebnis: Schnellere Bearbeitung, konsistente Datensätze und ein Self-Service-Erlebnis für über 50.000 Mitarbeitende."
                  - generic [ref=f18e107]:
                    - heading "Warum" [level=4] [ref=f18e108]
                    - paragraph [ref=f18e109]: HR-Services waren über verschiedene Systeme verteilt. Das zwang die Mitarbeitenden dazu, für Urlaub, Gehaltsabrechnung, Zusatzleistungen und Profilaktualisierungen zwischen mehreren Anwendungen zu wechseln — während doppelte Dateneingaben Compliance-Risiken und inkonsistente Datensätze verursachten.
                    - paragraph [ref=f18e110]: Die Bank benötigte eine vernetzte Plattform, um diese Lücken zu schließen, ohne Oracle als führendes System (System of Record) zu beeinträchtigen.
                - generic [ref=f18e111]:
                  - generic [ref=f18e112]:
                    - heading "Wie" [level=4] [ref=f18e113]
                    - paragraph [ref=f18e114]: InfoBeans entwickelte ein Unified Employee Center auf Basis von ServiceNow HRSD und konsolidierte über 85 HR-Services in einem einzigen, standardisierten Katalog mit automatisierter Fallerstellung und -weiterleitung. Die KI-gestützte Enterprise Knowledge Search verband ServiceNow über Zero-Copy-Metadaten-Indexierung mit externen Repositorys, sodass Mitarbeitende alle Informationen von einem zentralen Ort aus durchsuchen konnten, ohne Inhalte zu duplizieren. Ein dedizierter Profil-Synchronisations-Workflow, betrieben durch den FlowAPI Runner, ermöglichte es den Mitarbeitenden, persönliche Daten einmalig zu aktualisieren und in Echtzeit sicher mit Oracle zu synchronisieren.
                    - paragraph [ref=f18e115]: Gemeinsam senkten diese Funktionen die HR-Betriebskosten um 15–20 %, beschleunigten die Fallbearbeitung um 20–25 % und reduzierten den manuellen Aufwand für Profilaktualisierungen um 40–50 % — für ein konsistentes, rund um die Uhr verfügbares HR-Erlebnis der Mitarbeitenden.
                  - link "Wahre Geschichte anzeigen" [ref=f18e117] [cursor=pointer]:
                    - /url: /true-stories/reduzierung-der-hr-betriebskosten-um-20-prozent-und-schnellere-fallbearbeitung/
