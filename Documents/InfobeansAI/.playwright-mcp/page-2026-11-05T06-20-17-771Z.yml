        - generic [ref=f18e39]:
          - heading "Ein paar Sekunden, die ein ganzes Leben wert sind" [level=1] [ref=f18e40]
          - generic [ref=f18e42]:
            - paragraph [ref=f18e43]: Im Jahr 2009 kamen zwei Handwerker, um auf der Terrasse ein neues Schild anzubringen. Es handelte sich um ein kleines Büro mit einer offenen Dachterrasse. Der Metallrahmen des Schildes war schwer, daher bat Ritesh Darshan, ihn festzuhalten, während die Handwerker ihn festschraubten.
            - paragraph [ref=f18e44]: "Alles verlief wie gewohnt: Die Leute unterhielten sich, überprüften Maße und reichten Werkzeuge von unten herauf."
            - paragraph: Ritesh bemerkte, dass Darshan den Rahmen fest umklammerte, sein ganzer Körper völlig angespannt und wie angewurzelt war. Sein Gesicht wirkte verkrampft und seine Beine zitterten. In diesem Moment wurde ihm schnell klar, dass er die stromführende Leitung des alten Schildes neben sich berührt hatte.
            - paragraph: Er griff nach einem Seil, das die Arbeiter benutzt hatten, schlang es um Darshans Oberkörper und zog daran. Darshan löste den Kontakt und fiel rückwärts; zwei Sekunden lang rührte sich niemand, bevor jemand schrie und dann passierte alles auf einmal. Die Leute eilten herbei, und Ritesh blieb bei Darshan, bis sie das Krankenhaus erreichten.
            - paragraph: Ihm ging es gut. Die Ärzte sagten, er habe Glück gehabt.
            - paragraph: Wenn Ritesh heute über diesen Abend spricht, denkt er nicht darüber nach, was er getan hat. Er denkt an diese zwei Sekunden, in denen alles stillstand, und er hat keine Ahnung, ob er gewusst hätte, was zu tun sei, hätte er Zeit gehabt, darüber nachzudenken.
            - paragraph: Das ist es, was ihm im Gedächtnis geblieben ist. Nicht die Handlung selbst, sondern die Tatsache, dass er nie Zeit hatte, sich zu entscheiden. In diesen zwei Sekunden, in denen er keine Zeit zum Nachdenken hatte, war er einfach jemand, der handelte, bevor er nachdachte.
