        - generic [ref=f7e39]:
          - heading "The quietest kind of care" [level=1] [ref=f7e40]
          - generic [ref=f7e42]:
            - paragraph [ref=f7e43]: In 2022, life had shifted a little bit for Tarulata.
            - paragraph [ref=f7e44]: Her mother-in-law was critically ill, and the family was trying to bring her home after spending many days in the hospital. That meant arranging medical support they did not know how to put together quickly enough. And this was shortly after COVID, when even basic equipment was still difficult to find.
            - paragraph: She casually mentioned the situation at work with one of her colleagues. Not as a request exactly, but just as an unfiltered remark shared out of sheer exhaustion.
            - paragraph: To her surprise, the next morning, a loading rickshaw arrived outside her house carrying almost everything they had spent days trying to arrange.
            - paragraph: It included a medical bed, oxygen support, an IV stand, and other equipment she struggles to remember because the relief was overwhelming.
            - paragraph: But what stayed with her wasn't the equipment. The work somehow carried on without constantly asking for her. Only later did she learn that her manager had quietly informed the team to give her the space she didn't know how to ask for.
            - paragraph: Nobody ever spoke about it. That is what she remembers most. The fact that someone noticed what she needed before she had to ask.
          - paragraph [ref=f7e45]: Scroll to read more
